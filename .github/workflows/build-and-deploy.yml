# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Terraform Deploy

concurrency:
  group: terraform_${{ github.ref_name }}
  cancel-in-progress: false

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: choice
        options:
          - development
          - test
          - preproduction
          - production

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:

  terraform-plan:
    name: Terraform Plan (${{ matrix.environment }})

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - development
          - test
          - preproduction
          - production

    environment:
      name: ${{ matrix.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine Terraform Version
        id: terraform-version
        run: |
          terraform_version=$(awk '/{/{f=/^terraform/;next}f' terraform/application/terraform.tf | grep -o '[0-9\.]*' | head -1)
          echo "version=$terraform_version" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Plan
        run: |
          make ci ${{ matrix.environment }} terraform-plan

  deploy-nonprod:
    name: Deploy (${{ matrix.environment }})

    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - development
          - test
          - preproduction

    environment:
      name: ${{ matrix.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine Terraform Version
        id: terraform-version
        run: |
          terraform_version=$(awk '/{/{f=/^terraform/;next}f' terraform/application/terraform.tf | grep -o '[0-9\.]*' | head -1)
          echo "version=$terraform_version" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Apply
        run: |
          make ci ${{ matrix.environment }} terraform-apply

  deploy-production:
    name: Deploy Production

    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    needs:
      - deploy-nonprod

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine Terraform Version
        id: terraform-version
        run: |
          terraform_version=$(awk '/{/{f=/^terraform/;next}f' terraform/application/terraform.tf | grep -o '[0-9\.]*' | head -1)
          echo "version=$terraform_version" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Apply
        run: |
          make ci production terraform-apply


  deploy-domains-infra:
    name: Deploy Domains Infrastructure
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    concurrency: deploy-domains-infra
    needs: [deploy-production]
    environment:
      name: production
    permissions:
      id-token: write

    steps:
      - name: Deploy Domains Infrastructure
        id: deploy_domains_infra
        uses: DFE-Digital/github-actions/deploy-domains-infra@master
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          teams-webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          service: ${{ vars.TEAMS_MSG_SERVICE_NAME }}

  deploy_domains_env:
    name: Deploy Domains to ${{ matrix.domain_environment }} environment
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    concurrency: deploy-domains-${{ matrix.domain_environment }}
    needs: [deploy-domains-infra]
    strategy:
      max-parallel: 1
      matrix:
        domain_environment: [development, test, preproduction, production]
    environment:
      name: production
    permissions:
      id-token: write

    steps:
      - name: Deploy Domains Environment
        id: deploy_domains_env
        uses: DFE-Digital/github-actions/deploy-domains-env@master
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          environment: ${{ matrix.domain_environment }}
          healthcheck: health
          teams-webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          service: ${{ vars.TEAMS_MSG_SERVICE_NAME }}
